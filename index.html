<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アナログ放送ジェネレーター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: a dark living room at 3 a.m. The TV is the hero, a phosphor-green channel readout sits under it,
   and a tabbed editor (channels / images / captions / effects) works on whatever channel is on screen. */
:root{
  --room:#0c0a09;
  --panel:#17110d;
  --panel2:#221911;
  --line:#3d2d1f;
  --text:#f2e9db;
  --dim:#ab9c89;
  --amber:#ffb23e;
  --amber-ink:#2b1800;
  --phos:#8dffb4;
  --red:#ff6656;
  --font-ui:'Zen Kaku Gothic New',system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  --font-osd:'DotGothic16','Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--room);
  background-image:radial-gradient(120% 60% at 50% 0%,#2a1a0e 0%,rgba(12,10,9,0) 70%);
  background-repeat:no-repeat;
  color:var(--text);font:400 15px/1.55 var(--font-ui);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-block:10px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font:400 17px/1.25 var(--font-osd);letter-spacing:.06em;color:var(--amber);text-wrap:balance;word-break:keep-all}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:13px;white-space:nowrap}
.chip svg{width:16px;height:16px}

/* TV */
.stage{position:relative}
.stage::before{content:"";position:absolute;left:8%;right:8%;top:38%;bottom:-2%;background:radial-gradient(closest-side,rgba(255,170,70,.16),rgba(255,170,70,0));filter:blur(10px);pointer-events:none}
.tv{position:relative;width:100%;aspect-ratio:686/411;user-select:none;-webkit-user-select:none}
.screen{position:absolute;overflow:hidden;background:#000;--scan:.5}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 50%}
.screen.off canvas{animation:crtoff .42s ease-in forwards}
.screen.on canvas{animation:crton .55s ease-out}
@keyframes crtoff{0%{transform:scale(1,1);filter:brightness(1)}55%{transform:scale(1,.012);filter:brightness(3)}100%{transform:scale(0,.004);filter:brightness(0)}}
@keyframes crton{0%{transform:scale(1,.01);filter:brightness(4)}40%{transform:scale(1,.02);filter:brightness(3)}100%{transform:scale(1,1);filter:brightness(1)}}
.scan,.glass{position:absolute;inset:0;pointer-events:none}
.scan{opacity:var(--scan);background:repeating-linear-gradient(to bottom,rgba(0,0,0,.34) 0,rgba(0,0,0,.34) 1px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px)}
.scan::after{content:"";position:absolute;left:0;right:0;height:22%;top:-25%;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.055),rgba(255,255,255,0));animation:sweep 7s linear infinite}
@keyframes sweep{to{top:110%}}
.glass{background:radial-gradient(120% 110% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%),linear-gradient(118deg,rgba(255,255,255,.07) 0,rgba(255,255,255,0) 28%)}
.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.knob{position:absolute;display:block;aspect-ratio:1;transform:translate(-50%,-50%);padding:0;border:0;background:none;border-radius:50%;touch-action:none}
.knob::before{content:"";position:absolute;inset:calc(var(--pad,8px) * -1);border-radius:50%}
.knob img{width:100%;height:100%;display:block;pointer-events:none;transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.knob.drag img{transition:none}
.toast{position:absolute;left:50%;bottom:6px;transform:translate(-50%,8px);margin:0;padding:6px 14px;border-radius:999px;background:rgba(8,12,9,.88);border:1px solid #2c4a35;color:var(--phos);font:400 14px/1.4 var(--font-osd);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:94%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.legend{margin:0;font-size:12px;color:var(--dim);text-align:center;text-wrap:balance}

/* deck */
.deck{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.chrow{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;align-items:stretch}
.step{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center}
.step svg{width:24px;height:24px}
.readout{background:#050906;border:1px solid #1d3324;border-radius:10px;padding:8px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 18px rgba(80,255,150,.08)}
.readout b{font:400 26px/1.1 var(--font-osd);color:var(--phos);text-shadow:0 0 8px rgba(80,255,150,.55);letter-spacing:.06em}
.readout span{font:400 14px/1.3 var(--font-osd);color:#6fcf90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{position:relative;height:34px;border-radius:8px;background:#0e0a07;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:pointer}
.tl .lane{position:absolute;left:0;right:0;height:12px}
.tl .l1{top:4px}.tl .l2{top:18px}
.tl i{position:absolute;top:0;bottom:0;border-radius:3px}
.tl .img{background:#3b2f25;border-right:1px solid #0e0a07}
.tl .img.fl{background:repeating-linear-gradient(135deg,#5a4938 0 4px,#3b2f25 4px 8px)}
.tl .sub{background:var(--amber)}
.tl .head{position:absolute;top:0;bottom:0;width:2px;background:var(--phos);box-shadow:0 0 6px var(--phos);left:0}
.tlinfo{display:flex;justify-content:space-between;font:400 13px/1.2 var(--font-osd);color:var(--dim);margin-top:-6px}
.tlinfo .k{display:flex;gap:12px}
.tlinfo .k span::before{content:"";display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.tlinfo .k .a::before{background:#5a4938}.tlinfo .k .b::before{background:var(--amber)}
.ctl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ctl button{min-height:60px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;padding:4px 2px;line-height:1.2}
.ctl button svg{width:24px;height:24px}
.ctl button[aria-pressed=true]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.ctl button.hint{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,178,62,.45)}}
svg.i{fill:currentColor;stroke:none;flex:none}
svg.i.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* tabs + panels */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected=true]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font:400 16px/1.3 var(--font-osd);letter-spacing:.05em;color:var(--amber)}
.panel h3{margin:0;font-size:14px;font-weight:700;color:var(--text)}
.sub-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hint{color:var(--dim);font-size:13px;margin:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:13px;color:var(--dim)}
.lab.split{display:flex;justify-content:space-between;gap:8px}
.lab output{color:var(--text);font-variant-numeric:tabular-nums}
input[type=text],input[type=number],textarea,select{width:100%;min-height:46px;background:#0f0b08;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--text)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input[type=range]{width:100%;height:34px;accent-color:var(--amber);margin:0}
input[type=color]{width:46px;height:46px;border:1px solid var(--line);background:#0f0b08;border-radius:9px;padding:3px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 120px;min-width:0}
.row>.fix{flex:none}
.btn{min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ib{width:46px;min-height:46px;padding:0;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0f0b08}
.seg button{flex:1;min-height:44px;border:0;border-right:1px solid var(--line);background:transparent;padding:2px 4px;font-size:14px;line-height:1.25;min-width:0;white-space:normal}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--amber-ink);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--amber);flex:none;margin:0}
.chk span{font-size:14px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.on{border-color:var(--amber)}
.list{display:flex;flex-direction:column;gap:10px}
.chitem{display:grid;grid-template-columns:52px minmax(0,1fr) 46px 46px;gap:8px;align-items:center}
.chitem .num{min-height:46px;border-radius:9px;border:1px solid #1d3324;background:#050906;color:var(--phos);font:400 18px/1 var(--font-osd)}
.chitem.on .num{box-shadow:0 0 0 2px var(--phos)}
.imgcard .top2{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.th{width:84px;height:56px;object-fit:cover;border-radius:6px;background:#000;display:block;border:1px solid var(--line)}
button.thb{padding:0;border:0;background:none;border-radius:6px;position:relative}
button.thb::after{content:"映す";position:absolute;right:3px;bottom:3px;font-size:11px;padding:0 5px;border-radius:4px;background:rgba(0,0,0,.7);color:var(--phos)}
.imgcard .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.imgcard .meta b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgcard .acts{display:flex;gap:6px}
.imgcard .acts .btn{min-height:40px;width:40px;padding:0}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
details>summary{min-height:46px;display:flex;align-items:center;padding:0 14px;cursor:pointer;font-size:14px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";margin-left:auto;color:var(--amber)}
details[open]>summary::after{content:"－"}
details>.in{padding:2px 14px 14px;display:flex;flex-direction:column;gap:14px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.cats button[aria-pressed=true]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.lib button{padding:0;border:1px solid var(--line);background:#000;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.lib img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.lib span{font-size:11.5px;line-height:1.3;padding:3px 4px;background:var(--panel2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatches button[aria-pressed=true]{border-color:var(--amber)}
.foot{margin:0;font-size:12px;color:var(--dim);text-align:center;text-wrap:balance}
.tag{display:inline-block;font:400 12px/1 var(--font-osd);padding:4px 8px;border-radius:5px;background:#050906;border:1px solid #1d3324;color:var(--phos)}

/* recording mode */
.recbar{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding-inline:max(16px,env(safe-area-inset-left,0px));z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.recbar.show{opacity:1;pointer-events:auto}
.recbar .chip{background:rgba(23,17,13,.92)}
.recglitch{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,178,62,.5);background:rgba(23,17,13,.55);color:var(--amber);place-items:center;padding:0;z-index:19;touch-action:manipulation;opacity:.6}
.recglitch svg{width:26px;height:26px}
.recglitch:active{opacity:1;background:var(--amber);color:var(--amber-ink)}
body.rec.recbtn .recglitch{display:grid}
body.rec .top,body.rec .deck,body.rec .tabs,body.rec .panel,body.rec details.glob,body.rec .foot,body.rec .legend{display:none}
body.rec .app{min-height:calc(100svh - 20px);justify-content:center}
body.rec .toast{display:none}
@media (prefers-reduced-motion:reduce){.scan::after{animation:none}.knob img{transition:none}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <h1>アナログ放送<wbr>ジェネレーター</h1>
    <button class="chip" id="btnRec" type="button"></button>
  </header>

  <section class="stage" id="stage" aria-label="テレビ">
    <div class="tv" id="tv">
      <div class="screen on" id="screen">
        <canvas id="cv"></canvas>
        <div class="scan"></div>
        <div class="glass"></div>
      </div>
      <img class="frame" id="frameImg" alt="ブラウン管テレビ">
      <div id="knobs"></div>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </section>
  <p class="legend" id="legend"></p>

  <section class="deck" aria-label="操作">
    <div class="chrow">
      <button class="step" id="btnPrev" type="button" aria-label="前のチャンネル"></button>
      <div class="readout"><b id="chNum">CH 01</b><span id="chName">-</span></div>
      <button class="step" id="btnNext" type="button" aria-label="次のチャンネル"></button>
    </div>
    <div class="tl" id="tl" aria-label="放送の進行（タップで移動）"><div class="lane l1" id="tlImg"></div><div class="lane l2" id="tlSub"></div><div class="head" id="tlHead"></div></div>
    <div class="tlinfo"><span id="timeTxt">00:00 / 00:00</span><span class="k"><span class="a">映像</span><span class="b">字幕</span></span></div>
    <div class="ctl">
      <button type="button" id="btnRestart"></button>
      <button type="button" id="btnPlay"></button>
      <button type="button" id="btnSound"></button>
      <button type="button" id="btnGlitch"></button>
      <button type="button" id="btnPower"></button>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="編集">
    <button type="button" role="tab" data-tab="ch">チャンネル</button>
    <button type="button" role="tab" data-tab="img">映像</button>
    <button type="button" role="tab" data-tab="sub">字幕</button>
    <button type="button" role="tab" data-tab="fx">演出と音</button>
  </nav>
  <section class="panel" id="panel" role="tabpanel"></section>

  <details class="glob" id="glob">
    <summary>全体の設定（テレビの種類・ノイズ量・音量）</summary>
    <div class="in" id="globIn"></div>
  </details>
  <p class="foot">画像はこの端末のブラウザの中だけで処理され、外部には送信されません。</p>
</div>
<div class="recbar" id="recBar"><button class="chip" id="recToggle" type="button"></button><button class="chip" id="recExit" type="button">録画モードを終了</button></div>
<button class="recglitch" id="recGlitch" type="button" aria-label="乱れを起こす"></button>

const Au={ctx:null,bad:false,unlocked:false,duckUntil:0,
  init(){
    try{
      if(this.bad)return;

      const c=this.ctx,before=this.unlocked;

      this.unlocked=c.state==='running';

    }catch(e){this.bad=true}
    updateSoundUI();
  },
  build(c){
    this.ctx=c;

    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

    this.master=c.createGain();this.master.gain.value=0;this.master.connect(c.destination);
    const hs=c.createBufferSource();hs.buffer=nb;hs.loop=true;
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;
    this.hissG=c.createGain();this.hissG.gain.value=0;
    hs.connect(hp);hp.connect(lp);lp.connect(this.hissG);this.hissG.connect(this.master);hs.start();
    this.humG=c.createGain();this.humG.gain.value=0;
    [60,120,180].forEach((f,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;const g=c.createGain();g.gain.value=[1,.5,.25][i];o.connect(g);g.connect(this.humG);o.start()});
    this.humG.connect(this.master);
    this.toneG=c.createGain();this.toneG.gain.value=0;
    const to=c.createOscillator();to.type='sine';to.frequency.value=1000;to.connect(this.toneG);this.toneG.connect(this.master);to.start();
    this.apply();
  },
  apply(){
    if(!this.ctx||this.bad)return;

    const on=R.power&&!state.mute,duck=performance.now()<this.duckUntil,nm=clamp(state.noiseMaster,0,1.5);
    let hiss=ch.au.hiss/100;if(R.ended)hiss=Math.max(hiss,.55);
    const set=(g,v)=>{try{g.gain.setTargetAtTime(v,t,.04)}catch(e){}};

    set(this.hissG,duck?0:hiss*.2*(.35+.65*nm));

  },
  dropout(sec){this.duckUntil=performance.now()+sec*1000;this.apply();setTimeout(()=>this.apply(),sec*1000+40)},
  blip(kind){
    if(!this.ctx||this.bad||state.mute||!R.power||this.ctx.state!=='running')return;
    try{
      const c=this.ctx,t=c.currentTime;
      if(kind==='switch'){
        for(const [off,len,f0,f1,amp] of [[0,.38,700,4800,.3],[.17,.22,3000,900,.2]]){
          const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
          const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=.7;bp.frequency.setValueAtTime(f0,t+off);bp.frequency.exponentialRampToValueAtTime(f1,t+off+len);

        g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.16);
      }else if(kind==='on'){
        const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(15600,t+.45);
        const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3000;
        g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+.55);
        o.connect(lp);lp.connect(g);g.connect(this.master);o.start(t);o.stop(t+.6);
      }else if(kind==='off'){
        const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(50,t+.35);
        g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.38);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.4);

        o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.05);
      }

  }
};

const chAngle=(i,n)=>n<2?0:-135+270*i/(n-1);

function setKnobAngle(key,a){const b=knobsEl.querySelector(`[data-k="${key}"] img`);if(b)b.style.transform=`rotate(${a}deg)`}

  if(!dragging.ch)setKnobAngle('ch',chAngle(state.cur,state.channels.length));
  if(!dragging.noise)setKnobAngle('noise',noiseAngle());
  if(!dragging.vol)setKnobAngle('vol',state.mute?-135:volAngle());

}
function bindKnob(el,key){
  let d=null;
  el.addEventListener('pointerdown',e=>{
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    const r=el.getBoundingClientRect();d={cx:r.left+r.width/2,cy:r.top+r.height/2,x0:e.clientX,y0:e.clientY,moved:false};
  });
  el.addEventListener('pointermove',e=>{
    if(!d)return;
    if(!d.moved){if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<10)return;d.moved=true;if(key!=='pow'){dragging[key]=true;el.classList.add('drag')}}
    if(key==='pow')return;
    const a=clamp(Math.atan2(e.clientX-d.cx,-(e.clientY-d.cy))*180/Math.PI,-135,135);
    setKnobAngle(key,a);
    if(key==='ch'){const n=state.channels.length;if(n>1){const i=Math.round((a+135)/270*(n-1));if(i!==state.cur)tune(i)}}
    else if(key==='noise'){const v=Math.round((a+135)/270*1.5*20)/20;if(v!==state.noiseMaster){state.noiseMaster=v;onGlobal();toast('ノイズ量 '+Math.round(v*100)+'%')}}
    else if(key==='vol'){const v=Math.round((a+135)/270*20)/20;if(v!==state.volume||state.mute){state.volume=v;state.mute=false;onGlobal();toast('音量 '+Math.round(v*100)+'%')}}
  });
  const end=e=>{
    if(!d)return;const was=d;d=null;el.classList.remove('drag');dragging[key]=false;
    if(!was.moved)knobTap(key);else{updateKnobs();save()}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('keydown',e=>{
    if(key==='ch'&&(e.key==='ArrowRight'||e.key==='ArrowUp')){e.preventDefault();tune(state.cur+1)}

  else if(key==='vol'){state.mute=!state.mute;onGlobal();toast(state.mute?'ミュート':'音量 '+Math.round(state.volume*100)+'%')}

/* ---------- broadcast logic ---------- */
function mkSlot(i,start){
  const ch=curCh(),im=ch.images[i],sec=Math.max(.5,im.sec),fl=[];
  if(im.flash){
    const l1=rnd(.12,.3),a=start+rnd(.2,Math.max(.25,sec-1));fl.push([a,a+l1]);
    if(sec>2.5&&Math.random()<.6){const l2=rnd(.08,.18),b=a+l1+rnd(.25,.6);if(b+l2<start+sec)fl.push([b,b+l2])}
  }
  R.slot={i,start,end:start+sec,fl};
}
function setSlotAt(t){
  const ch=curCh(),imgs=ch.images,n=imgs.length;
  if(!n){R.slot={i:-1,start:0,end:1e9,fl:[]};return}
  if(ch.order==='rand'){mkSlot((Math.random()*n)|0,t);return}
  const C=imgs.reduce((a,i)=>a+Math.max(.5,i.sec),0);let u=t%C,cum=0,idx=0;
  for(let k=0;k<n;k++){const s=Math.max(.5,imgs[k].sec);if(u<cum+s){idx=k;break}cum+=s;idx=k}
  mkSlot(idx,t-(u-cum));
}
function advanceSlot(){
  const ch=curCh(),n=ch.images.length;if(!n)return;
  let i=R.slot.i;
  if(ch.order==='rand'&&n>1){let j;do{j=(Math.random()*n)|0}while(j===i);i=j}else i=(i+1)%n;
  mkSlot(i,R.slot.end);
}
function scheduleNext(){
  const g=curCh().fx.glitch/100*state.noiseMaster;
  if(g<=.01){R.nextEvt=Infinity;return}
  R.nextEvt=R.now+lerp(16,1.6,Math.min(1,g))*(.5+Math.random());
}
function startEvent(type,manual){
  const ch=curCh(),flags=ch.fx.ev,all=['shift','roll','freeze','blackout','snow'];let allowed=all.filter(k=>flags[k]);
  if(!type){if(!allowed.length){if(!manual){scheduleNext();return}allowed=all}type=allowed[(Math.random()*allowed.length)|0]}
  const D={shift:[.18,.5],roll:[.35,.8],freeze:[.5,1.4],blackout:[.3,.8],snow:[.25,.7]}[type];
  const dur=rnd(D[0],D[1]);
  R.evt={type,t0:R.now,dur,captured:false};
  if(ch.au.dropout)Au.dropout(type==='freeze'?dur*.6:dur*.9);
}
function endEvent(){if(R.evt&&R.evt.type==='blackout')R.flashUntil=R.now+.2;R.evt=null;scheduleNext()}

function tune(i,opts={}){
  const n=state.channels.length;i=((i%n)+n)%n;
  state.cur=i;R.t=0;R.ended=false;R.evt=null;setSlotAt(0);scheduleNext();
  R.trans={t0:R.now,dur:.8};
  R.osd1='CH '+pad2(i+1);R.osd2=curCh().name;R.osdUntil=R.now+2.6;

function drawImg(c,d,im,t){
  const iw=d.naturalWidth||d.width,ih=d.naturalHeight||d.height;
  const p=clamp((t-R.slot.start)/Math.max(.5,R.slot.end-R.slot.start),0,1),drift=im.flash?1:1+.035*p;
  const base=im.fit==='contain'?Math.min(W/iw,H/ih):Math.max(W/iw,H/ih),s=base*im.zoom*drift,dw=iw*s,dh=ih*s;
  const ox=Math.max(0,dw-W)/2,oy=Math.max(0,dh-H)/2;

}
function tint(c,kind){

    tctx.globalCompositeOperation='source-over';tctx.drawImage(buf,0,0);
    c.globalCompositeOperation='multiply';c.drawImage(tcv,0,0);
    c.fillStyle='#d6d6d6';c.fillRect(0,0,W,H);
    c.globalCompositeOperation='color';c.fillStyle='#2bff66';c.fillRect(0,0,W,H);
    c.globalCompositeOperation='source-over';
    const g=c.createRadialGradient(W/2,H/2,H*.22,W/2,H/2,H*.9);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.65)');
    c.fillStyle=g;c.fillRect(0,0,W,H);return;
  }

    c.globalCompositeOperation='multiply';c.fillStyle='#fff1d2';c.fillRect(0,0,W,H);

}
function wrapLines(c,text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){let line='';for(const chr of para){const test=line+chr;if(c.measureText(test).width>maxW&&line){out.push(line);line=chr}else line=test}out.push(line)}
  return out;
}
function drawSub(c,s,t,idx){
  const p0=t-s.start,a=clamp(Math.min(p0/.12,(s.dur-p0)/.25),0,1);if(a<=0||!s.text)return;
  const sz=H*({s:.075,m:.105,l:.15}[s.size]||.105);
  c.save();c.globalAlpha=a;c.font=`${sz}px ${OSD}`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  const lines=wrapLines(c,s.text,W*.9),lh=sz*1.25,total=lines.length*lh;
  const yc=s.pos==='t'?H*.07+total/2:s.pos==='m'?H/2:H*.94-total/2;
  if(s.band){c.fillStyle='rgba(0,0,0,.62)';c.fillRect(0,yc-total/2-sz*.2,W,total+sz*.4)}
  let dx=0,split=false;
  if(s.fx==='glitch'){const k=Math.floor(R.now*9);if(hash(k+idx*7)>.8){dx=(hash(k*3.1+idx)-.5)*sz*.9;split=true}}
  else if(s.fx==='noise'){const by=R.band.y;if(Math.abs(by-yc)<total/2+sz*.7)dx=(Math.random()-.5)*sz*1.3}
  lines.forEach((ln,k)=>{
    const y=yc-total/2+lh*(k+.5);
    if(split){c.fillStyle='rgba(255,40,40,.75)';c.fillText(ln,W/2+dx-3,y);c.fillStyle='rgba(40,230,255,.75)';c.fillText(ln,W/2+dx+3,y)}

}
function snow(c,pl,alpha){noiseFill(c,pl.snow,alpha,0,0,W,H,1)}
function bigText(c,text,size,y,col){c.font=`${H*size}px ${OSD}`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(text,W/2,y)}
function drawEnd(c,ch){
  const since=R.now-R.endAt;
  if(ch.ending==='end'&&since<3.4){
    c.fillStyle='#07070b';c.fillRect(0,0,W,H);snow(c,P.buf,.05);
    bigText(c,'放送終了',.16,H*.45,'#f4f4f4');bigText(c,'ご視聴ありがとうございました',.065,H*.62,'#b9b9c4');
  }else snow(c,P.buf,1);
}
function drawBase(ch){
  const c=bctx,t=R.t;
  c.globalCompositeOperation='source-over';c.globalAlpha=1;c.fillStyle='#000';c.fillRect(0,0,W,H);
  if(R.ended){drawEnd(c,ch);return}
  const subs=[];ch.subs.forEach((s,i)=>{if(t>=s.start&&t<s.start+s.dur)subs.push([s,i])});
  const blackV=subs.some(([s])=>s.black),im=R.slot.i>=0?ch.images[R.slot.i]:null;
  if(!im){snow(c,P.buf,1);if(!subs.length){
    c.fillStyle='rgba(0,0,0,.7)';c.fillRect(W*.14,H*.34,W*.72,H*.34);
    bigText(c,'NO SIGNAL',.11,H*.46,'#e8e8e8');bigText(c,'「映像」タブで画像を追加できます',.058,H*.59,'#bdbdbd')}}
  else if(blackV){snow(c,P.buf,.1)}
  else{
    const d=getDrawable(im.src),inFl=!im.flash||R.slot.fl.some(f=>t>=f[0]&&t<f[1]);
    if(!d||!inFl)snow(c,P.buf,1);

    c.save();c.font=`${H*.07}px ${OSD}`;c.textAlign='left';c.textBaseline='top';c.shadowColor='rgba(0,0,0,.9)';c.shadowBlur=3;c.fillStyle='#f4f4f4';c.fillText(ch.stamp,W*.05,H*.06);c.restore();

}
function rgbSplit(amt){
  cctx.globalCompositeOperation='source-over';cctx.globalAlpha=1;cctx.fillStyle='#000';cctx.fillRect(0,0,W,H);
  [['#ff0000',-amt],['#00ff00',0],['#0000ff',amt]].forEach(([col,dx])=>{
    tctx.globalCompositeOperation='source-over';tctx.drawImage(buf,0,0);
    tctx.globalCompositeOperation='multiply';tctx.fillStyle=col;tctx.fillRect(0,0,W,H);
    cctx.globalCompositeOperation='lighter';cctx.drawImage(tcv,dx,0);
  });
  cctx.globalCompositeOperation='source-over';tctx.globalCompositeOperation='source-over';
}
function drawOSD(){
  if(R.now<R.osdUntil){
    const a=Math.min(1,(R.osdUntil-R.now)/.5);
    ctx.save();ctx.globalAlpha=a;ctx.textBaseline='top';ctx.textAlign='right';ctx.shadowColor='#2cff7a';ctx.shadowBlur=7;ctx.fillStyle='#8dffb4';
    ctx.lineJoin='round';ctx.strokeStyle='rgba(0,20,8,.8)';
    ctx.font=`${H*.12}px ${OSD}`;ctx.lineWidth=H*.03;ctx.strokeText(R.osd1,W-W*.05,H*.06);ctx.fillText(R.osd1,W-W*.05,H*.06);
    ctx.font=`${H*.065}px ${OSD}`;ctx.lineWidth=H*.02;ctx.strokeText(R.osd2,W-W*.05,H*.06+H*.14);ctx.fillText(R.osd2,W-W*.05,H*.06+H*.14);ctx.restore();
  }
  if(R.now<R.msgUntil){
    ctx.save();ctx.globalAlpha=Math.min(1,(R.msgUntil-R.now)/.4);ctx.textBaseline='top';ctx.textAlign='left';ctx.shadowColor='#2cff7a';ctx.shadowBlur=7;ctx.fillStyle='#8dffb4';
    ctx.lineJoin='round';ctx.strokeStyle='rgba(0,20,8,.8)';ctx.lineWidth=H*.025;
    ctx.font=`${H*.085}px ${OSD}`;ctx.strokeText(R.msg,W*.05,H*.06);ctx.fillText(R.msg,W*.05,H*.06);ctx.restore();

}
function render(){
  if(!R.power){if(!R.offAt)R.offAt=R.now;if(R.now-R.offAt>.5&&!R.blank){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);R.blank=true}return}
  R.offAt=0;
  const ch=curCh(),fx=ch.fx,nm=state.noiseMaster;
  const nz=clamp(fx.noise/100*nm,0,1.6),flick=fx.flicker/100;
  drawBase(ch);
  const ev=R.evt,p=ev?clamp((R.now-ev.t0)/ev.dur,0,1):0;
  const tp=(R.now-R.trans.t0)/R.trans.dur,inTrans=tp>=0&&tp<1;
  let rgbAmt=fx.rgb/100*nm*3.2;
  if(ev&&(ev.type==='shift'||ev.type==='snow'))rgbAmt+=5*Math.sin(p*Math.PI);
  if(inTrans)rgbAmt+=9*(1-tp);
  let src=buf;
  if(rgbAmt>.4){rgbSplit(rgbAmt);src=comp}
  if(ev&&ev.type==='freeze'){if(!ev.captured){fctx.drawImage(src,0,0);ev.captured=true}src=frz}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  let shift=0,roll=0;
  if(ev&&ev.type==='shift')shift=1;
  if(ev&&ev.type==='roll')roll=((p*p*1.6+.05)*H)%H;
  if(inTrans){shift=Math.max(shift,(1-tp)*1.4);if(tp<.55)roll=roll||(((tp/.55)*(tp/.55)*1.2)*H)%H}
  if(roll>1){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.drawImage(src,0,roll);ctx.drawImage(src,0,roll-H);
    ctx.fillStyle='#000';ctx.fillRect(0,roll-5,W,10);
  }else if(shift>0){
    let y=0;
    while(y<H){
      const bh=Math.min(H-y,(rnd(4,22))|0);
      const dx=Math.random()<.55?rnd(-1,1)*W*.12*shift*(Math.random()<.2?3:1):0;
      ctx.drawImage(src,0,y,W,bh,dx,y,W,bh);
      if(dx>0)ctx.drawImage(src,0,y,W,bh,dx-W,y,W,bh);else if(dx<0)ctx.drawImage(src,0,y,W,bh,dx+W,y,W,bh);

    }
  }else ctx.drawImage(src,0,0);
  // flicker
  if(flick>0){
    const fl=(Math.sin(R.now*13)*.5+Math.random()*.5)*flick*.14;
    if(fl>0){ctx.fillStyle=`rgba(0,0,0,${fl})`;ctx.fillRect(0,0,W,H)}
    if(Math.random()<.025*flick){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,0,W,H)}
  }
  // grain
  noiseFill(ctx,P.main.grain,nz*.3,0,0,W,H,1);
  // running horizontal band
  if(nz>.03){
    R.band.y=(R.band.y+R.dt*H*(.16+nz*.3))%(H+80);
    const bh=7+nz*18;
    noiseFill(ctx,P.main.snow,.1+.4*Math.min(1,nz),0,R.band.y-bh,W,bh,1);
    if(nz>.15&&Math.random()<.3){
      ctx.fillStyle=`rgba(255,255,255,${.18*Math.min(1,nz)})`;
      const ly=rnd(0,H),lw=rnd(W*.2,W*.9),lx=rnd(0,W-lw);ctx.fillRect(lx,ly,lw,1+((Math.random()*2)|0));
    }
  }
  // events
  if(ev){
    if(ev.type==='blackout'){const a=p<.12?p/.12:p>.85?1-(p-.85)/.15:1;ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H)}

  // channel change
  if(inTrans){
    const a=tp<.3?1:Math.pow(1-(tp-.3)/.7,1.5);
    noiseFill(ctx,P.main.snow,a,0,0,W,H,1.3);
  }
  drawOSD();
}
function step(dt){
  if(!R.power)return;
  const ch=curCh();
  if(R.playing&&!R.ended){
    R.t+=dt;
    if(R.t>=ch.duration){
      if(ch.ending==='loop'){R.t=R.t%ch.duration;setSlotAt(R.t)}
      else{R.t=ch.duration;R.ended=true;R.endAt=R.now;Au.apply()}
    }
  }
  if(!R.ended&&ch.images.length){let g=0;while(R.t>=R.slot.end&&g++<50)advanceSlot()}
  if(R.evt&&R.now>R.evt.t0+R.evt.dur)endEvent();
  else if(!R.evt&&R.now>=R.nextEvt)startEvent();
}
let lastRender=0;
function loop(ts){
  requestAnimationFrame(loop);
  const now=performance.now();if(now-lastRender<28)return;
  R.dt=Math.min(.1,(now-lastRender)/1000);lastRender=now;R.now=now/1000;
  try{step(R.dt);render();updateClock()}catch(e){console.error(e)}
}

  panel.textContent='';
  ({ch:renderChannels,img:renderImages,sub:renderSubs,fx:renderFx}[R.tab])();
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{R.tab=b.dataset.tab;renderEditor()}));

function head(title){const ch=curCh();return h('div',{class:'sub-h'},h('h2',null,title),h('span',{class:'tag'},'CH '+pad2(state.cur+1)+' '+(ch.name||'')))}

function addChannel(){
  const ch=mkCh('新しい番組',{duration:20});state.channels.push(ch);tune(state.channels.length-1,{noEditor:true});
  R.tab='img';renderEditor();toast('CH '+pad2(state.cur+1)+' を追加しました');
}
function dupChannel(i){
  const c=clone(state.channels[i]);c.id=uid();c.name=(c.name||'番組')+' のコピー';c.images.forEach(x=>x.id=uid());c.subs.forEach(x=>x.id=uid());
  state.channels.splice(i+1,0,c);tune(i+1);toast('複製しました');
}
function delChannel(i){
  if(state.channels.length<=1){toast('最後の1チャンネルは削除できません');return}
  const wasCur=state.cur===i;state.channels.splice(i,1);
  if(state.cur>i)state.cur--;
  if(wasCur){state.cur=Math.min(i,state.channels.length-1)}
  tune(state.cur);gcBlobs();toast('削除しました');
}
function renderChannels(){
  const n=state.channels.length;
  panel.append(h('div',{class:'sub-h'},h('h2',null,'チャンネル'),h('span',{class:'tag'},n+' ch')));
  panel.append(h('p',{class:'hint'},'番号をタップするとそのチャンネルに切り替わり、以降の編集はそのチャンネルに反映されます。番号は並び順に自動で振られます。'));
  const list=h('div',{class:'list'});
  state.channels.forEach((c,i)=>{
    const name=h('input',{type:'text',value:c.name,'aria-label':'CH '+(i+1)+' の名前',placeholder:'番組名',oninput:()=>{c.name=name.value;if(i===state.cur)updateDeck();save()}});
    list.append(h('div',{class:'chitem'+(i===state.cur?' on':'')},
      h('button',{type:'button',class:'num','aria-label':'CH '+(i+1)+' に切り替え',onclick:()=>tune(i)},pad2(i+1)),
      name,
      h('button',{type:'button',class:'btn ib',title:'複製','aria-label':'CH '+(i+1)+' を複製',html:ico('copy'),onclick:()=>dupChannel(i)}),
      n>1?twoTap('CH '+(i+1)+' を削除','削除する',()=>delChannel(i),'btn warn','trash',true)
         :h('button',{type:'button',class:'btn ib',disabled:true,title:'最後の1チャンネルは削除できません','aria-label':'最後の1チャンネルは削除できません',html:ico('trash')})
    ));
  });
  panel.append(list);
  if(n<=1)panel.append(h('p',{class:'hint'},'最後の1チャンネルは削除できません。'));
  panel.append(h('button',{type:'button',class:'btn primary',html:ico('plus')+'チャンネルを追加',onclick:addChannel}));
  const ch=curCh();
  panel.append(h('h3',null,'CH '+pad2(state.cur+1)+' の放送設定'));
  panel.append(h('div',{class:'row'},
    numF('放送の長さ',ch,'duration',{min:2,max:600,step:1,after:()=>{if(R.t>ch.duration)seekTo(0);renderTimeline()}}),
    h('div',{class:'field fix'},h('label',{class:'lab'},'　'),h('button',{type:'button',class:'btn',onclick:()=>{fitDuration(ch);renderEditor();toast('放送の長さを '+ch.duration+' 秒にしました')}},'映像と字幕に合わせる'))));
  panel.append(segF('終わったとき',ch,'ending',[['loop','くり返す'],['end','放送終了'],['snow','砂嵐']]));
  panel.append(segF('映像の切り替え順',ch,'order',[['seq','登録順'],['rand','ランダム']],changed,()=>{setSlotAt(R.t)}));
  panel.append(textF('日付・時刻の表示（空なら非表示）',ch,'stamp',{ph:'例：PM 11:47  OCT. 31 1998'}));
}
function fitDuration(ch){
  const C=ch.images.reduce((a,i)=>a+Math.max(.5,i.sec),0),S=ch.subs.reduce((a,s)=>Math.max(a,s.start+s.dur),0);
  ch.duration=clamp(Math.ceil(Math.max(C,S,2)),2,600);changed();
}

/* ---------- editor: images ---------- */
function showImage(i){
  const ch=curCh();let t=0;for(let k=0;k<i;k++)t+=Math.max(.5,ch.images[k].sec);
  R.t=Math.min(t+.05,ch.duration-.05);R.ended=false;
  if(ch.order==='rand')mkSlot(i,R.t);else setSlotAt(R.t);
  window.scrollTo({top:0,behavior:'smooth'});
}
const imgTotal=ch=>ch.images.reduce((a,i)=>a+Math.max(.5,i.sec),0);
function growDuration(ch){const C=Math.ceil(imgTotal(ch));if(C>ch.duration){ch.duration=Math.min(600,C);return true}return false}
async function addFiles(files){
  const ch=curCh();let n=0,bad=0;
  for(const f of files){
    const okType=(f.type&&f.type.startsWith('image/'))||/\.(png|jpe?g|webp|gif|bmp|avif|heic|heif)$/i.test(f.name||'');
    if(!okType){bad++;continue}
    const id=uid();blobMem.set(id,f);
    let d=null;try{d=await loadDrawable('usr:'+id)}catch(e){}
    if(!d){blobMem.delete(id);bad++;continue}
    drawCache.set('usr:'+id,d);await DB.put('blobs',id,f);
    ch.images.push(mkImg('A_static',5,{src:'usr:'+id}));n++;
  }
  if(n){
    const grew=growDuration(ch);save();renderTimeline();renderEditor();showImage(ch.images.length-1);
    toast(n+'枚追加しました'+(grew?'（放送の長さを '+ch.duration+' 秒に延ばしました）':'')+(bad?`／${bad}枚は読み込めませんでした`:''));
  }else toast('画像を読み込めませんでした。PNG・JPEG・WebPの画像を選んでください');
}
function renderImages(){
  const ch=curCh();
  panel.append(head('映像'));
  panel.append(h('p',{class:'hint'},'このチャンネルに流す画像です。上から順に、それぞれの秒数だけ映ります。サムネイルをタップすると、その画像をテレビに映します。'));
  const file=h('input',{type:'file',accept:'image/*',multiple:true,id:'fileIn',style:{display:'none'},onchange:()=>{addFiles([...file.files]);file.value=''}});
  panel.append(h('div',{class:'row'},
    h('button',{type:'button',class:'btn primary',html:ico('image')+'写真を追加',onclick:()=>file.click()}),file));
  // library
  const cats=['すべて',...new Set(Object.values(ASSETS.tiles).map(t=>t.cat))];
  const grid=h('div',{class:'lib'}),catRow=h('div',{class:'cats'});
  const fill=()=>{
    grid.textContent='';
    Object.entries(ASSETS.tiles).filter(([k,t])=>R.libCat==='すべて'||t.cat===R.libCat).forEach(([k,t])=>{
      grid.append(h('button',{type:'button','aria-label':t.label+'を追加',onclick:()=>{ch.images.push(mkImg(k,5));const grew=growDuration(ch);changed();renderEditor();showImage(ch.images.length-1);toast(t.label+' を追加しました'+(grew?'（放送の長さを '+ch.duration+' 秒に延ばしました）':''))}},
        h('img',{src:t.src,alt:'',loading:'lazy'}),h('span',null,t.label)));
    });
    [...catRow.children].forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===R.libCat)));
  };
  cats.forEach(c=>catRow.append(h('button',{type:'button','aria-pressed':String(c===R.libCat),onclick:()=>{R.libCat=c;fill()}},c)));
  const det=h('details',{id:'libDet'},h('summary',null,'素材から追加（付属の映像 '+Object.keys(ASSETS.tiles).length+' 点）'),h('div',{class:'in'},catRow,grid));
  panel.append(det);fill();
  if(R.libOpen)det.open=true;det.addEventListener('toggle',()=>{R.libOpen=det.open});
  panel.append(h('div',{class:'sub-h'},h('h3',null,'登録中の映像'),h('span',{class:'hint'},ch.images.length+' 枚（合計 '+Math.round(imgTotal(ch))+' 秒）')));
  if(imgTotal(ch)>ch.duration+.01)panel.append(h('div',{class:'card on'},h('p',{class:'hint',style:{color:'var(--amber)'}},'映像の合計が放送の長さ（'+ch.duration+' 秒）を超えています。超えた分は流れません。'),
    h('button',{type:'button',class:'btn primary',onclick:()=>{growDuration(ch);changed();renderEditor();toast('放送の長さを '+ch.duration+' 秒にしました')}},'放送の長さを延ばす')));
  const list=h('div',{class:'list'});
  if(!ch.images.length)list.append(h('p',{class:'hint'},'まだ映像がありません。「写真を追加」か「素材から追加」で登録すると、テレビに映ります。'));
  ch.images.forEach((im,i)=>{
    const move=d=>{const j=i+d;if(j<0||j>=ch.images.length)return;[ch.images[i],ch.images[j]]=[ch.images[j],ch.images[i]];changed();renderEditor()};
    const adj=h('details',null,h('summary',null,'表示の調整（拡大・位置）'),h('div',{class:'in'},
      segF('画面への収め方',im,'fit',[['cover','画面いっぱい'],['contain','全体を表示']]),
      rangeF('拡大',im,'zoom',1,3,.05,v=>Math.round(v*100)+'%'),
      rangeF('横の位置',im,'px',-100,100,1,v=>v>0?'右へ '+v:v<0?'左へ '+(-v):'中央'),
      rangeF('縦の位置',im,'py',-100,100,1,v=>v>0?'下へ '+v:v<0?'上へ '+(-v):'中央')));
    list.append(h('div',{class:'card imgcard'},
      h('div',{class:'top2'},
        h('button',{type:'button',class:'thb','aria-label':'この画像をテレビに映す',onclick:()=>showImage(i)},thumbEl(im.src)),
        h('div',{class:'meta'},h('b',null,(i+1)+'. '+imgLabel(im.src)),
          h('div',{class:'acts'},
            h('button',{type:'button',class:'btn',title:'上へ','aria-label':'上へ',html:ico('up'),disabled:i===0,onclick:()=>move(-1)}),
            h('button',{type:'button',class:'btn',title:'下へ','aria-label':'下へ',html:ico('down'),disabled:i===ch.images.length-1,onclick:()=>move(1)}),
            twoTap('この画像を外す','外す',()=>{ch.images.splice(i,1);changed();gcBlobs();if(R.slot.i>=ch.images.length||R.slot.i===i)setSlotAt(R.t);renderEditor()},'btn warn','trash',true)))),
      numF('表示する長さ',im,'sec',{min:.5,max:120,step:.5,after:renderTimeline}),
      chkF('一瞬だけ映す（砂嵐の中でちらつく）',im,'flash'),
      adj));
  });
  panel.append(list);
  panel.append(segF('映像の切り替え順',ch,'order',[['seq','登録順'],['rand','ランダム']],changed,()=>{setSlotAt(R.t)}));
}

/* ---------- editor: subtitles ---------- */
const SWATCH=['#ffffff','#ffe66b','#ff6b6b','#7df0ff','#8dffb4'];
function renderSubs(){
  const ch=curCh();
  panel.append(head('字幕'));
  panel.append(h('p',{class:'hint'},'放送が始まってから何秒目に、何秒間出すかを決めます。画面下のバーの黄色い部分が字幕の出る位置です。'));
  panel.append(h('div',{class:'row'},
    h('button',{type:'button',class:'btn primary',html:ico('plus')+'字幕を追加',onclick:()=>{
      const last=ch.subs.reduce((a,s)=>Math.max(a,s.start+s.dur),0);
      ch.subs.push(mkSub('ここに字幕を入力',Math.min(last,Math.max(0,ch.duration-3)),3));
      if(last+3>ch.duration)ch.duration=Math.ceil(last+3);
      changed();renderEditor();toast('字幕を追加しました')}}),
    h('button',{type:'button',class:'btn',onclick:()=>{let t=0;ch.subs.forEach(s=>{s.start=t;t+=s.dur});if(t>ch.duration)ch.duration=Math.ceil(t);changed();renderEditor();toast('登録順に連続して並べました')}},'登録順に並べる')));
  const list=h('div',{class:'list'});
  if(!ch.subs.length)list.append(h('p',{class:'hint'},'字幕はまだありません。'));
  ch.subs.forEach((s,i)=>{
    const colorIn=h('input',{type:'color',value:s.color,'aria-label':'文字色',oninput:()=>{s.color=colorIn.value;sw.forEach(([b,c])=>b.setAttribute('aria-pressed',String(c.toLowerCase()===s.color.toLowerCase())));changed()}});
    const sw=SWATCH.map(c=>[h('button',{type:'button',style:{background:c},'aria-label':'文字色 '+c,'aria-pressed':String(c===s.color),onclick:()=>{s.color=c;colorIn.value=c;sw.forEach(([b,cc])=>b.setAttribute('aria-pressed',String(cc===c)));changed()}}),c]);
    list.append(h('div',{class:'card'},
      h('div',{class:'sub-h'},h('h3',null,'字幕 '+(i+1)),
        h('div',{class:'acts',style:{display:'flex',gap:'6px'}},
          h('button',{type:'button',class:'btn',style:{minHeight:'40px'},html:ico('eye')+'見る',onclick:()=>{R.t=clamp(s.start+.05,0,ch.duration-.05);R.ended=false;setSlotAt(R.t);window.scrollTo({top:0,behavior:'smooth'})}}),
          twoTap('この字幕を削除','削除',()=>{ch.subs.splice(i,1);changed();renderEditor()},'btn warn','trash',true))),
      textF('文章（改行できます）',s,'text',{area:true,ph:'字幕の文章'}),
      h('div',{class:'row'},numF('出る時間（開始）',s,'start',{min:0,max:600,step:.5}),numF('出ている長さ',s,'dur',{min:.5,max:120,step:.5})),
      segF('位置',s,'pos',[['t','上'],['m','中央'],['b','下']]),
      segF('大きさ',s,'size',[['s','小'],['m','中'],['l','大']]),
      field('文字の色',h('div',{class:'swatches'},sw.map(x=>x[0]),colorIn)),
      chkF('黒い半透明の帯を敷く',s,'band'),
      segF('文字の演出',s,'fx',[['none','ふつう'],['glitch','ときどき乱れる'],['noise','ノイズでずれる']]),
      chkF('字幕の間は映像を消す（字幕だけ残す）',s,'black')));
  });
  panel.append(list);
}

/* ---------- editor: effects ---------- */
function renderFx(){
  const ch=curCh(),fx=ch.fx,au=ch.au;
  panel.append(head('演出と音'));
  panel.append(h('p',{class:'hint'},'このチャンネルだけの設定です。全体のノイズ量は、テレビの下のダイヤルか「全体の設定」で変えられます。'));
  panel.append(h('h3',null,'映像'));
  panel.append(rangeF('砂嵐の粒（常時のノイズ）',fx,'noise',0,100,1,v=>v+'%'));
  panel.append(rangeF('走査線（細い横線）',fx,'scan',0,100,1,v=>v+'%'));
  panel.append(rangeF('色ずれ',fx,'rgb',0,100,1,v=>v+'%'));
  panel.append(rangeF('明るさのちらつき',fx,'flicker',0,100,1,v=>v+'%'));
  panel.append(segF('画面の色味',fx,'tint',[['none','そのまま'],['mono','白黒'],['green','暗視'],['sepia','セピア'],['vhs','ビデオ褪せ']]));
  panel.append(h('h3',null,'突然の乱れ'));
  panel.append(rangeF('乱れの起こりやすさ',fx,'glitch',0,100,1,v=>v===0?'起こらない':v+'%'));
  panel.append(h('div',{class:'row'},chkF('横ずれ',fx.ev,'shift'),chkF('上下に流れる',fx.ev,'roll'),chkF('映像が止まる',fx.ev,'freeze'),chkF('暗転',fx.ev,'blackout'),chkF('砂嵐が覆う',fx.ev,'snow')));
  panel.append(h('button',{type:'button',class:'btn',html:ico('bolt')+'乱れをいま見る',onclick:()=>{if(R.power){startEvent(null,true);window.scrollTo({top:0,behavior:'smooth'})}}}));
  panel.append(h('h3',null,'音'));
  panel.append(rangeF('砂嵐の「ザーッ」',au,'hiss',0,100,1,v=>v+'%'));
  panel.append(rangeF('低い唸り（ブーン）',au,'hum',0,100,1,v=>v+'%'));
  panel.append(chkF('「ピー」という確認音を流す',au,'tone'));
  panel.append(chkF('乱れに合わせて音を途切れさせる',au,'dropout'));
  panel.append(h('p',{class:'hint'},'音は端末の音量と、メディアの音量が小さいと聞こえません。iPhoneはマナーモードだと鳴らないことがあります。'));
}

/* ---------- global panel ---------- */
let syncGlobalUI=()=>{};
function renderGlobal(){
  const g=$('#globIn');g.textContent='';
  const nOut=h('output',null,Math.round(state.noiseMaster*100)+'%'),vOut=h('output',null,Math.round(state.volume*100)+'%');
  const nIn=h('input',{type:'range',min:0,max:150,step:5,value:Math.round(state.noiseMaster*100),'aria-label':'ノイズ量',oninput:()=>{state.noiseMaster=nIn.value/100;nOut.textContent=nIn.value+'%';Au.apply();updateKnobs();if(!R.evt)scheduleNext();save()}});
  const vIn=h('input',{type:'range',min:0,max:100,step:5,value:Math.round(state.volume*100),'aria-label':'音量',oninput:()=>{state.volume=vIn.value/100;state.mute=false;vOut.textContent=vIn.value+'%';mIn.checked=false;Au.apply();updateKnobs();updateSoundUI();save()}});
  const mIn=h('input',{type:'checkbox',checked:state.mute,onchange:()=>{state.mute=mIn.checked;Au.apply();updateKnobs();updateSoundUI();save()}});
  const rIn=h('input',{type:'checkbox',checked:state.recBtn,onchange:()=>{state.recBtn=rIn.checked;applyRecBtn();save()}});
  syncGlobalUI=()=>{rIn.checked=state.recBtn;nIn.value=Math.round(state.noiseMaster*100);nOut.textContent=nIn.value+'%';vIn.value=Math.round(state.volume*100);vOut.textContent=vIn.value+'%';mIn.checked=state.mute};
  const frameSeg=h('div',{class:'seg',role:'group','aria-label':'テレビの種類'});
  const fkeys=Object.keys(ASSETS.frames);
  fkeys.forEach(v=>frameSeg.append(h('button',{type:'button','aria-pressed':String(state.frame===v),onclick:()=>{state.frame=v;[...frameSeg.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(fkeys[i]===v)));setupFrame();save()}},ASSETS.frames[v].label)));
  g.append(field('テレビの種類',frameSeg));
  g.append(h('div',{class:'field'},h('div',{class:'lab split'},h('span',null,'ノイズ量（全チャンネル共通）'),nOut),nIn));
  g.append(h('div',{class:'field'},h('div',{class:'lab split'},h('span',null,'音量'),vOut),vIn));
  g.append(h('label',{class:'chk'},mIn,h('span',null,'ミュート')));
  g.append(h('p',{class:'hint'},'ミュートにしても、ノイズの映像演出は続きます。'));
  g.append(h('label',{class:'chk'},rIn,h('span',null,'録画モードで「乱れボタン」を画面の端に置く')));
  g.append(h('p',{class:'hint'},'録画中に好きなタイミングで乱れを起こせます。録画モード中も、背景をタップすると出るバーでオン・オフを切り替えられます。'));
  g.append(twoTap('最初の状態に戻す','全部消して初期化',async()=>{
    await DB.clear('kv');await DB.clear('blobs');blobMem.clear();drawCache.clear();thumbCache.clear();
    state=defaultState();R.tab='ch';R.t=0;setupFrame();renderGlobal();tune(state.cur,{silent:true});applyFxCss();Au.apply();toast('初期状態に戻しました')},'btn warn','trash'));
}

/* ---------- boot ---------- */
async function boot(){
  bindDeck();
  $('#btnRec').innerHTML=ico('rec')+'録画モード';
  try{await DB.open();const s=await DB.get('kv','project');if(s)state=sanitize(s)}catch(e){}
  setupFrame();renderGlobal();applyRecBtn();
  R.now=performance.now()/1000;
  setSlotAt(0);scheduleNext();
  R.osd1='CH '+pad2(state.cur+1);R.osd2=curCh().name;R.osdUntil=R.now+3;R.trans={t0:R.now,dur:.7};
  applyFxCss();updateDeck();renderTimeline();renderEditor();
  try{document.fonts&&document.fonts.load(`16px DotGothic16`,'あア字幕')}catch(e){}
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)Au.ctx&&Au.ctx.suspend&&Au.ctx.suspend().catch(()=>{});else if(Au.unlocked)Au.ctx&&Au.ctx.resume&&Au.ctx.resume().catch(()=>{})});
  window.__tv={state:()=>state,R,tune,Au};
}
boot();
})();

</script>
